# Зона лимитов DDoS
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

# GZIP настройки
gzip on;
gzip_disable "msie6";
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_min_length 256;
gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript application/manifest+json;

# Проверяем User-Agent. Если находим совпадение - ставим переменную $bad_bot в 1, иначе в 0.
map $http_user_agent $bad_bot {
    default 0;
    # ~* означает регулярное выражение, нечувствительное к регистру
    ~*(nmap|nikto|sqlmap|postman|python-requests|go-http-client|java|wget|curl) 1;
}

# 1. HTTP-сервер: ловит запросы на 80 порт и кидает на HTTPS
server {
    listen 80;
    server_name kosyga.ru www.kosyga.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS-сервер: Основной защищенный
server {
    listen 443 ssl;
    server_name kosyga.ru www.kosyga.ru;

    ssl_certificate /etc/letsencrypt/live/kosyga.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kosyga.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # === ПРИМЕНЯЕМ БЛОКИРОВКУ ===
    # Если $bad_bot равен 1, сразу отдаем 403 Forbidden
    if ($bad_bot) {
        return 403;
    }

    # Кэшируем ассеты Vite на 1 год 
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Отдаем статику Vue
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html; 
    }

    # Проксируем API
    location /api/ {
        limit_req zone=api_limit burst=150 nodelay;
        
        proxy_pass http://backend:8000; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
