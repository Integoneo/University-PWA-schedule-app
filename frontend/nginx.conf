# Зона лимитов DDoS
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

# GZIP настройки
gzip on;
gzip_disable "msie6";
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_min_length 256;
gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript application/manifest+json;

# Проверяем User-Agent.
map $http_user_agent $bad_bot {
    default 0;
    ~*(nmap|nikto|sqlmap|postman|python-requests|go-http-client|java|wget|curl) 1;
}

# === НОВАЯ ПРОВЕРКА X-Device-ID ===
# Если заголовка нет - пропускаем (0). Если есть и это валидный UUID (36 символов) - пропускаем (0). 
# Любой другой мусор или несовпадение длины - блокируем (1).
map $http_x_device_id $invalid_device_id {
    default       1;  # По умолчанию блокируем
    ""            0;  # Если заголовка вообще нет - это ОК (возвращаем 0)
    # Регулярка для строгого формата UUID (8-4-4-4-12)
    "~^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" 0;
}

# 1. HTTP-сервер: ловит запросы на 80 порт и кидает на HTTPS
server {
    listen 80;
    server_name kosyga.ru www.kosyga.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS-сервер: Основной защищенный
server {
    listen 443 ssl;
    server_name kosyga.ru www.kosyga.ru;

    ssl_certificate /etc/letsencrypt/live/kosyga.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kosyga.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # === ПРИМЕНЯЕМ БЛОКИРОВКУ БОТОВ ===
    if ($bad_bot) {
        return 403;
    }

    # === ПРИМЕНЯЕМ БЛОКИРОВКУ КРИВЫХ DEVICE-ID ===
    # Отдаем 400 Bad Request, если кто-то шлет длинный мусор в заголовок
    if ($invalid_device_id) {
        return 400 "Invalid X-Device-ID format";
    }

    # Кэшируем ассеты Vite на 1 год 
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Отдаем статику Vue (КЭШ СТРОГО ЗАПРЕЩЕН ДЛЯ ИНДЕКСА И SW)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html; 
        
        # Вот эта строчка гарантирует, что PWA будет обновляться у всех юзеров моментально!
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Проксируем API
    location /api/ {
        limit_req zone=api_limit burst=150 nodelay;
        
        proxy_pass http://backend:8000; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
