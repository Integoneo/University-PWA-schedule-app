# === НОВАЯ ПРОВЕРКА X-Device-ID ===
# Если заголовка нет - пропускаем (0). Если есть и это валидный UUID (36 символов) - пропускаем (0).
map $http_x_device_id $invalid_device_id {
    default       1;  
    ""            0;  
    "~^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" 0;
}

# 1. Базовый GZIP для быстрой отдачи статики
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

server {
    listen 80;
    # Символ '_' позволяет Nginx отвечать на любые хосты (localhost, 127.0.0.1, IP в Wi-Fi сети)
    server_name _;

    # === ПРИМЕНЯЕМ БЛОКИРОВКУ КРИВЫХ DEVICE-ID ===
    # Отдаем 400 Bad Request, если заголовок не прошел проверку
    if ($invalid_device_id) {
        return 400 "Invalid X-Device-ID format";
    }

    root /usr/share/nginx/html;
    index index.html;
    

    # Запрещаем кэшировать сам файл сервис-воркера
    location ~* (sw\.js|service-worker\.js)$ {
        root /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # 2. Раздача статики и SPA-роутинг Vue (HTML5 History mode)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 3. Статические ассеты (без долгого кэширования, чтобы сразу видеть правки)
    location /assets/ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 4. Проксирование API в бэкенд
    location /api/ {
        proxy_pass http://backend:8000;

        # Поддержка HTTP/1.1 и WebSockets/SSE
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Проброс заголовков
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты для удобного дебага бэкенда
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }
}
