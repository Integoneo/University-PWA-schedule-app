# 1. Базовый GZIP для быстрой отдачи статики
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

server {
    listen 80;
    # Символ '_' позволяет Nginx отвечать на любые хосты (localhost, 127.0.0.1, IP в Wi-Fi сети)
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 2. Раздача статики и SPA-роутинг Vue (HTML5 History mode)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 3. Статические ассеты (без долгого кэширования, чтобы сразу видеть правки)
    location /assets/ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 4. Проксирование API в бэкенд
    location /api/ {
        proxy_pass http://backend:8000;

        # Поддержка HTTP/1.1 и WebSockets/SSE
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Проброс заголовков
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты для удобного дебага бэкенда (чтобы Nginx не рвал связь во время брейкпоинтов)
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }
}
