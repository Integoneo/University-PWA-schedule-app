x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  # =========================================================================
  #  ОБЩИЕ БАЗОВЫЕ СЕРВИСЫ
  # =========================================================================

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    <<: *default-logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-super_password}
      POSTGRES_DB: ${POSTGRES_DB:-database}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./init-db-extensions.sql:/docker-entrypoint-initdb.d/init-db-extensions.sql
      - ./data/postgres/:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-database}",
        ]
      interval: 5s
      retries: 5

  redis_db:
    image: redis:8.8.1-alpine
    container_name: redis_db
    <<: *default-logging
    restart: unless-stopped
    # Если REDIS_PASSWORD задан на проде — включит авторизацию, если пуст (локалка) — запустится без пароля
    command: >
      sh -c '
        if [ -z "${REDIS_PASSWORD}" ]; then
          redis-server --appendonly yes
        else
          redis-server --requirepass "${REDIS_PASSWORD}" --appendonly yes
        fi
      '
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: >
        sh -c '
          if [ -z "${REDIS_PASSWORD}" ]; then
            redis-cli ping
          else
            redis-cli -a "${REDIS_PASSWORD}" ping
          fi
        '
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    volumes:
      - ./data/redis:/data

  backend:
    build: ./python-backend
    container_name: backend
    <<: *default-logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-super_password}
      POSTGRES_DB: ${POSTGRES_DB:-database}
      POSTGRES_PORT: 5432
      POSTGRES_HOST: postgres
      REDIS_URL: ${REDIS_URL:-redis://redis_db:6379}
      DOWNLOAD_DIR: ${DOWNLOAD_DIR:-/tmp/ramdisk}
      DLQ_DIR: ${DLQ_DIR:-/app/dlq}
      KUMA_URL: ${KUMA_URL_PYTHON_WORKER:-}
      IS_PRODUCTION: ${IS_PRODUCTION:-False}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis_db:
        condition: service_healthy
    volumes:
      - shared_ramdisk:${DOWNLOAD_DIR:-/tmp/ramdisk}
      - ./data/dlq:${DLQ_DIR:-/app/dlq}

  cpp_parser:
    build: ./cpp-parser
    container_name: cpp_parser
    <<: *default-logging
    restart: unless-stopped
    environment:
      # Единый формат URL для C++ (дефолт без пароля для локалки, на проде берется из .env)
      REDIS_URL: ${REDIS_URL_CPP:-tcp://redis_db:6379}
      DOWNLOAD_DIR: ${DOWNLOAD_DIR:-/tmp/ramdisk}
      ARCHIVE_DIR: ${ARCHIVE_DIR:-/app/archive}
      DLQ_DIR: ${DLQ_DIR:-/app/dlq}
      KUMA_URL: ${KUMA_URL_CPP:-}
    depends_on:
      redis_db:
        condition: service_healthy
    volumes:
      - shared_ramdisk:${DOWNLOAD_DIR:-/tmp/ramdisk}
      - ./data/dlq:${DLQ_DIR:-/app/dlq}
      - ./data/archive:${ARCHIVE_DIR:-/app/archive}

  mock_excels:
    build: ./scanner/mock-script
    container_name: mock_excels
    profiles:
      - mock
    <<: *default-logging
    environment:
      DOWNLOAD_DIR: ${DOWNLOAD_DIR:-/tmp/ramdisk}
    depends_on:
      - backend
    volumes:
      - shared_ramdisk:${DOWNLOAD_DIR:-/tmp/ramdisk}

  observer:
    build: ./scanner/observer
    container_name: observer
    profiles:
      - local
      - prod
    <<: *default-logging
    restart: on-failure:3
    environment:
      PROXY_HOST: ${PROXY_HOST:-}
      PROXY_PORT: ${PROXY_PORT:-}
      PROXY_LOGIN_PARSING: ${PROXY_LOGIN_PARSING:-}
      PROXY_PASSWORD_PARSING: ${PROXY_PASSWORD_PARSING:-}
      REDIS_URL: ${REDIS_URL:-redis://redis_db:6379}
      IS_PRODUCTION: ${IS_PRODUCTION:-False}
      KUMA_URL: ${KUMA_URL_OBSERVER:-}
    depends_on:
      redis_db:
        condition: service_healthy

  downloader:
    build: ./scanner/downloader
    container_name: downloader
    profiles:
      - local
      - prod
    <<: *default-logging
    restart: unless-stopped
    environment:
      PROXY_HOST: ${PROXY_HOST:-}
      PROXY_PORT: ${PROXY_PORT:-}
      PROXY_LOGIN_PARSING: ${PROXY_LOGIN_PARSING:-}
      PROXY_PASSWORD_PARSING: ${PROXY_PASSWORD_PARSING:-}
      REDIS_URL: ${REDIS_URL:-redis://redis_db:6379}
      IS_PRODUCTION: ${IS_PRODUCTION:-False}
      DOWNLOAD_DIR: ${DOWNLOAD_DIR:-/tmp/ramdisk}
      KUMA_URL: ${KUMA_URL_DOWNLOADER:-}
    depends_on:
      redis_db:
        condition: service_healthy
    volumes:
      - shared_ramdisk:${DOWNLOAD_DIR:-/tmp/ramdisk}

  # =========================================================================
  #  ФРОНТЕНД (Разделен профилями из-за разных Dockerfile и SSL)
  # =========================================================================

  # Локальный фронтенд (поднимается по умолчанию с профилем local)
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: local.Dockerfile
    container_name: frontend_local
    profiles:
      - local
      - mock
    <<: *default-logging
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  # Продакшен фронтенд (только с профилем prod)
  frontend-prod:
    build:
      context: ./frontend
      dockerfile: prod.Dockerfile
    container_name: frontend_prod
    profiles:
      - prod
    <<: *default-logging
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro

  # =========================================================================
  #  ВСПОМОГАТЕЛЬНЫЕ СЕРВИСЫ
  # =========================================================================

  notifier:
    build: ./notifier
    container_name: notifier
    profiles: ["notify", "prod"]
    <<: *default-logging
    restart: unless-stopped
    environment:
      PROXY_HOST_TG: ${PROXY_HOST_TG:-}
      PROXY_PORT_TG: ${PROXY_PORT_TG:-}
      PROXY_LOGIN_TG: ${PROXY_LOGIN_TG:-}
      PROXY_PASSWORD_TG: ${PROXY_PASSWORD_TG:-}
      TG_BOT_TOKEN: ${TG_BOT_TOKEN:-}
      TG_CHAT_ID: ${TG_CHAT_ID:-}
      REDIS_URL: ${REDIS_URL:-redis://redis_db:6379}
      KUMA_URL: ${KUMA_URL_NOTIFIER:-}
    depends_on:
      redis_db:
        condition: service_healthy

  uptime-kuma:
    image: louislam/uptime-kuma:2.4.0-slim
    container_name: uptime_kuma
    profiles: ["prod"]
    <<: *default-logging
    restart: unless-stopped
    environment:
      NOTIFICATION_PROXY: "http://${PROXY_LOGIN_TG:-}:${PROXY_PASSWORD_TG:-}@${PROXY_HOST_TG:-}:${PROXY_PORT_TG:-}"
    volumes:
      - ./data/kuma:/app/data
    ports:
      - "127.0.0.1:3001:3001"

  beszel-hub:
    image: henrygd/beszel:latest
    container_name: beszel_hub
    profiles: ["prod"]
    <<: *default-logging
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./data/beszel:/beszel_data

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel_agent
    profiles: ["prod"]
    <<: *default-logging
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: 45876
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  certbot:
    image: certbot/certbot
    container_name: certbot
    profiles: ["prod"]
    <<: *default-logging
    restart: unless-stopped
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  shared_ramdisk:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=128m,uid=1000
